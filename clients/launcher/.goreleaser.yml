version: 2

project_name: buggy

before:
  hooks:
    - go mod tidy

builds:
  - id: buggy
    dir: .
    main: ./main.go
    binary: buggy
    env:
      - CGO_ENABLED=0
    # One artifact per OS/arch: Linux, macOS and Windows on amd64 + arm64.
    # arm64 covers Apple Silicon and 64-bit Raspberry Pi OS (Pi 3/4/5).
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/saivarun3407/buggy/clients/launcher/cmd.version={{.Version}}
      # The repository this launcher updates from and pulls images of. The
      # release workflow sets BUGGY_REPO_SLUG to github.repository; a local
      # snapshot build falls back to this fork.
      - -X github.com/saivarun3407/buggy/clients/launcher/internal/project.DefaultRepo={{ envOrDefault "BUGGY_REPO_SLUG" "saivarun3407/Buggy" }}

archives:
  - id: binaries
    format: binary
    name_template: "buggy-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  # The repository the tag was pushed to (set by .github/workflows/release.yml
  # from the GitHub context), never a hard-coded organisation.
  github:
    owner: '{{ envOrDefault "BUGGY_RELEASE_OWNER" "saivarun3407" }}'
    name: '{{ envOrDefault "BUGGY_RELEASE_NAME" "Buggy" }}'
  # Publish as draft so the GitHub `releases/latest` endpoint (used by the
  # launcher's update notice and explicit `buggy update`) does NOT see
  # this version until every Docker image is verified on GHCR. The publish-release job in
  # .github/workflows/release.yml flips draft → published once all images
  # exist, closing the release-atomicity gap that previously let the
  # launcher pull a tag whose images were still mid-push.
  draft: true
  prerelease: auto
  name_template: "v{{.Version}}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
